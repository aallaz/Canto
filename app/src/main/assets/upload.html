<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canto – Boîte à histoires</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%0A%20%20%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2248%22%20fill%3D%22%23E9DFD0%22/%3E%0A%20%20%3Cpath%20d%3D%22M29%2C34%20L27%2C17%20L42%2C27%20Z%20M71%2C34%20L73%2C17%20L58%2C27%20Z%22%20fill%3D%22%23141414%22/%3E%0A%20%20%3Cpath%20d%3D%22M38%2C78%20L40%2C88%20L45%2C79%20Z%20M55%2C79%20L60%2C88%20L62%2C78%20Z%22%20fill%3D%22%23141414%22/%3E%0A%20%20%3Ccircle%20cx%3D%2250%22%20cy%3D%2255%22%20r%3D%2228%22%20fill%3D%22%23141414%22/%3E%0A%20%20%3Cpath%20d%3D%22M23%2C50%20C21%2C14%2079%2C14%2077%2C50%22%20fill%3D%22none%22%20stroke%3D%22%23141414%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Cpath%20d%3D%22M23%2C50%20C21%2C14%2079%2C14%2077%2C50%22%20fill%3D%22none%22%20stroke%3D%22%23E9DFD0%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Cellipse%20cx%3D%2222%22%20cy%3D%2254%22%20rx%3D%226.5%22%20ry%3D%2210%22%20fill%3D%22%23E9DFD0%22%20stroke%3D%22%23141414%22%20stroke-width%3D%223%22/%3E%0A%20%20%3Cellipse%20cx%3D%2278%22%20cy%3D%2254%22%20rx%3D%226.5%22%20ry%3D%2210%22%20fill%3D%22%23E9DFD0%22%20stroke%3D%22%23141414%22%20stroke-width%3D%223%22/%3E%0A%20%20%3Cellipse%20cx%3D%2278%22%20cy%3D%2254%22%20rx%3D%223%22%20ry%3D%226%22%20fill%3D%22%23141414%22/%3E%0A%20%20%3Ccircle%20cx%3D%2239%22%20cy%3D%2247%22%20r%3D%222.4%22%20fill%3D%22%23E9DFD0%22/%3E%0A%20%20%3Ccircle%20cx%3D%2261%22%20cy%3D%2247%22%20r%3D%222.4%22%20fill%3D%22%23E9DFD0%22/%3E%0A%20%20%3Cellipse%20cx%3D%2250%22%20cy%3D%2259%22%20rx%3D%2210.5%22%20ry%3D%228%22%20fill%3D%22none%22%20stroke%3D%22%23E9DFD0%22%20stroke-width%3D%222%22/%3E%0A%20%20%3Cellipse%20cx%3D%2246%22%20cy%3D%2259%22%20rx%3D%221.6%22%20ry%3D%222.8%22%20fill%3D%22%23E9DFD0%22/%3E%0A%20%20%3Cellipse%20cx%3D%2254%22%20cy%3D%2259%22%20rx%3D%221.6%22%20ry%3D%222.8%22%20fill%3D%22%23E9DFD0%22/%3E%0A%20%20%3Cpath%20d%3D%22M15.5%2C36%20V25%20L21%2C23.5%20V26%22%20fill%3D%22none%22%20stroke%3D%22%23141414%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Cellipse%20cx%3D%2213.6%22%20cy%3D%2236.4%22%20rx%3D%222.6%22%20ry%3D%222%22%20fill%3D%22%23141414%22/%3E%0A%20%20%3Cpath%20d%3D%22M85%2C30%20V20%20L89%2C22%22%20fill%3D%22none%22%20stroke%3D%22%23141414%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22/%3E%0A%20%20%3Cellipse%20cx%3D%2283.1%22%20cy%3D%2230.4%22%20rx%3D%222.6%22%20ry%3D%222%22%20fill%3D%22%23141414%22/%3E%0A%3C/svg%3E">
<style>
  :root { --bg:#121116; --surface:#1d1b23; --frame:#3b3747; --text:#e6dfcb; --muted:#9a93a8;
          --amber:#c9972f; --teal:#2e8f8b; --moss:#7a9a3c; --ember:#c2632a; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text);
         max-width: 1560px; margin: 0 auto; padding: 16px; }
  /* Page à la hauteur de la fenêtre : les tuiles défilent, la fiche reste entière à droite. */
  @media (min-width: 761px) {
    body { height: 100vh; display: flex; flex-direction: column; }
    #main:not([hidden]), #library:not([hidden]) { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #add { flex: 1; min-height: 0; overflow-y: auto; padding-right: 8px; }
    #shelf { flex: 1; min-height: 0; }
    #shelf #grid { max-height: 100%; overflow-y: auto; align-content: start; padding: 0 10px 12px 0; }
  }
  h1 { color: var(--amber); margin: 8px 0 16px; display: flex; align-items: center; gap: 14px; }
  h1 svg { width: 64px; height: 64px; flex: none; }
  h1 small { display: block; font-size: 15px; color: var(--muted); font-weight: normal; }
  a.button { display: inline-block; text-decoration: none; font-size: 17px; font-weight: bold; padding: 10px 16px; border: 3px solid #000;
             background: var(--teal); color: var(--bg); box-shadow: 4px 4px 0 #000; }
  /* Boutons de la fiche : même hauteur, lien ou bouton. */
  #detail .actions a.button, #detail .actions button { display: inline-flex; align-items: center; justify-content: center;
             height: 50px; padding: 0 10px; line-height: 1; font-family: inherit; }
  button.danger { background: var(--ember); }
  #detail .row { margin-top: 14px; }
  .banner { border: 3px solid var(--frame); padding: 10px 12px; margin: 0 0 12px; }
  .banner.err { border-color: var(--ember); }
  input[type=password], input[type=text] { font-size: 18px; padding: 10px; width: 100%;
         background: var(--surface); color: var(--text); border: 3px solid var(--frame); }
  button { font-size: 17px; font-weight: bold; padding: 10px 16px; border: 3px solid #000;
           background: var(--amber); color: var(--bg); cursor: pointer; box-shadow: 4px 4px 0 #000; }
  button.secondary { background: var(--frame); color: var(--text); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .info { color: var(--muted); } .ok { color: var(--moss); } .warn { color: var(--amber); } .err { color: var(--ember); }
  [hidden] { display: none !important; }

  nav { display: flex; gap: 12px; margin-bottom: 18px; }
  nav button { background: var(--surface); color: var(--muted); box-shadow: none; border-color: var(--frame); }
  nav button.active { background: var(--amber); color: var(--bg); border-color: #000; box-shadow: 4px 4px 0 #000; }

  /* Bibliothèque : mêmes tuiles encadrées que dans l'app. */
  /* 5 tuiles par ligne, puis la fiche à droite (moins de colonnes sur un écran étroit). */
  #grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px; padding-bottom: 12px; }
  @media (max-width: 1250px) { #grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 1050px) { #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 760px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile { background: var(--surface); border: 4px solid var(--frame); box-shadow: 6px 6px 0 #000;
          padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .tile.open { border-color: var(--amber); }
  .tile .cover { aspect-ratio: 1; background: var(--frame); display: flex; align-items: center; justify-content: center;
                 font-size: 48px; color: var(--text); overflow: hidden; }
  .tile .cover img { width: 100%; height: 100%; object-fit: cover; }
  .tile .title { font-weight: 900; text-transform: uppercase; font-size: 14px; line-height: 1.25;
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.5em; }
  .tile .meta { color: var(--muted); font-size: 13px; }
  /* Fiche d'un album : colonne à droite sur toute la hauteur de la fenêtre. */
  #shelf { display: flex; gap: 26px; align-items: stretch; }
  #shelf #grid { flex: 1; min-width: 0; }
  #detail { flex: 0 0 360px; margin: 0 7px 7px 0; overflow-y: auto;
            background: var(--surface); border: 4px solid var(--amber); box-shadow: 6px 6px 0 #000; padding: 14px;
            display: flex; flex-direction: column; gap: 10px; }
  #detail h2 { margin: 0; color: var(--amber); }
  #detail .cover { flex: none; width: 200px; align-self: center; aspect-ratio: 1; background: var(--frame); display: flex; align-items: center; justify-content: center;
                   font-size: 64px; overflow: hidden; }
  #detail .cover img { width: 100%; height: 100%; object-fit: cover; }
  #detail ol { margin: 0; padding-left: 26px; flex: 1; }
  #detail .actions { margin-top: 4px; flex-wrap: nowrap; }
  #detail .actions > * { flex: 1; min-width: 0; white-space: nowrap; }
  #detail .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
                   text-align: center; gap: 12px; color: var(--muted); }
  #detail .empty .cover { border: 3px dashed var(--frame); background: none; color: var(--frame); }
  #detail .empty b { color: var(--amber); font-size: 20px; }
  #detail .close { align-self: flex-end; margin: -6px -6px 0 0; background: none; border: none; box-shadow: none;
                   color: var(--text); font-size: 26px; padding: 0 6px; }
  @media (max-width: 760px) {
    #shelf { flex-direction: column-reverse; }
    #detail { flex-basis: auto; width: 100%; }
  }
  .add-tile { border-style: dashed; justify-content: center; align-items: center; text-align: center; color: var(--muted); min-height: 200px; font-weight: bold; }
  .add-tile span { font-size: 54px; line-height: 1; color: var(--amber); }

  /* Ajout */
  #drop { border: 3px dashed var(--frame); padding: 28px 16px; text-align: center; margin: 12px 0; }
  #drop.over { border-color: var(--amber); background: var(--surface); }
  #drop p { margin: 0 0 14px; color: var(--muted); }
  #add h2 { color: var(--amber); margin: 0 0 10px; }
  .cover-pick { margin-top: 8px; }
  .cover-pick input[type=text] { flex: 1; min-width: 220px; width: auto; font-size: 16px; padding: 8px; }
  .cover-pick input.bad { border-color: var(--ember); }
  .cover-pick .info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .card { background: var(--surface); border: 3px solid var(--frame); padding: 12px; margin: 12px 0; box-shadow: 5px 5px 0 #000; }
  .card.off { opacity: .55; }
  .card header { display: flex; gap: 10px; align-items: center; }
  .card header input[type=text] { flex: 1; font-weight: bold; }
  .card header input[type=checkbox] { width: 24px; height: 24px; }
  .card img { width: 64px; height: 64px; object-fit: cover; border: 2px solid var(--frame); }
  .summary { color: var(--muted); margin: 8px 0 4px; }
  ul.checks { list-style: none; padding: 0; margin: 6px 0 0; }
  ul.checks li { padding: 2px 0; }
  details { color: var(--muted); margin-top: 6px; }
  #progress { height: 14px; background: var(--surface); border: 2px solid var(--frame); margin-top: 14px; }
  #bar { height: 100%; width: 0; background: var(--teal); transition: width .2s; }
  #status { margin-top: 8px; white-space: pre-wrap; }
  #detailError { margin-top: 12px; }

  /* Fenêtre de confirmation (remplace confirm/alert du navigateur). */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #modal .box { background: var(--surface); border: 4px solid var(--frame); box-shadow: 6px 6px 0 #000; padding: 18px; max-width: 520px; width: 100%; }
  #modal h2 { margin: 0 0 8px; color: var(--amber); font-size: 20px; }
  #modal p { margin: 0 0 16px; white-space: pre-wrap; }
  #modal .row { justify-content: flex-end; }
</style>
</head>
<body>

  <circle cx="50" cy="55" r="28" fill="#141414"/>
  <path d="M23,50 C21,14 79,14 77,50" fill="none" stroke="#141414" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M23,50 C21,14 79,14 77,50" fill="none" stroke="#E9DFD0" stroke-width="1.2" stroke-linecap="round"/>
  <ellipse cx="22" cy="54" rx="6.5" ry="10" fill="#E9DFD0" stroke="#141414" stroke-width="3"/>
  <ellipse cx="78" cy="54" rx="6.5" ry="10" fill="#E9DFD0" stroke="#141414" stroke-width="3"/>

</svg><span>Canto<small>Boîte à histoires</small></span></h1>

<section id="main">
  <nav>
    <button id="tabMusic">Musique</button>
    <button id="tabStories" class="active">Histoires</button>
    <button id="tabAdd">Ajouter à Histoires</button>
  </nav>

  <section id="library">
    <div id="libraryNotice" class="banner err" hidden></div>
    <p id="libraryInfo" class="info"></p>
    <div id="shelf">
      <div id="grid"></div>
      <aside id="detail"></aside>
    </div>
  </section>

  <section id="add" hidden>
    <h2 id="addTitle">Ajouter une histoire</h2>
    <div id="target" class="banner info"></div>
    <div id="drop">
      <p id="dropHint"></p>
      <div class="row" style="justify-content:center">
        <button id="switchCategory" class="secondary"></button>
        <button id="pickDir">Choisir un dossier…</button>
        <button id="pickFiles" class="secondary">Choisir des fichiers…</button>
      </div>
      <input id="dirInput" type="file" webkitdirectory multiple hidden>
      <input id="fileInput" type="file" multiple hidden accept="audio/*,image/*,.nfo">
    </div>

    <div id="stories"></div>

    <div class="row" id="actions" hidden>
      <button id="send">Envoyer</button>
      <button id="clear" class="secondary">Vider la liste</button>
      <span id="totals" class="info"></span>
    </div>
    <div id="progress" hidden><div id="bar"></div></div>
    <div id="status"></div>
  </section>
</section>

<div id="modal" hidden>
  <div class="box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <div class="row">
      <button id="modalCancel" class="secondary">Annuler</button>
      <button id="modalOk">OK</button>
    </div>
  </div>
</div>

<script>
const AUDIO = ['mp3', 'm4a', 'wav', 'aac', 'ogg', 'flac'];
const IMAGES = ['jpg', 'jpeg', 'png'];
const NFO = ['nfo'];
const COVER_NAME = /^(cover|folder)\.(jpe?g|png)$/i;
const COVER_HINT = /(cover|folder|front|album)/i;
const JUNK = /^(\..*|thumbs\.db|desktop\.ini)$/i;

const $ = id => document.getElementById(id);
let existing = [];
let library = [];
let openStory = null;
let stories = [];
let sending = false;
// Éléments de l'envoi en cours : un ajout pendant l'envoi ne s'y mélange pas.
let inFlight = [];
// Rubrique affichée et visée par l'ajout : 'stories' (Histoires) ou 'music' (Musique).
let category = 'stories';
let tab = 'library';
const words = {
  stories: { one: 'histoire', a: 'une histoire', the: 'cette histoire', dir: 'Histoires', saved: 'enregistrées', none: 'Aucune histoire sur la boîte pour l’instant.', icon: '♪' },
  music: { one: 'album', a: 'un album', the: 'cet album', dir: 'Musique', saved: 'enregistrés', none: 'Aucun album sur la boîte pour l’instant.', icon: '♫' }
};
const w = () => words[category];
const withCategory = (path, target = category) => path + (path.includes('?') ? '&' : '?') + 'c=' + target;

const ext = name => name.includes('.') ? name.split('.').pop().toLowerCase() : '';
const size = n => n > 1e9 ? (n / 1e9).toFixed(1) + ' Go' : n > 1e6 ? (n / 1e6).toFixed(1) + ' Mo' : Math.ceil(n / 1e3) + ' Ko';
const plural = (n, word) => `${n} ${word}${n > 1 ? 's' : ''}`;
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  children.flat().forEach(c => node.append(c));
  return node;
};
// Pas de code : la page n'est accessible que sur le Wi-Fi de la maison, pendant un transfert.
const api = (path, options = {}) => fetch(path, options);

// --- Fenêtre de confirmation ---

/** Affiche une fenêtre ; résout true si l'utilisateur valide. Sans cancelLabel : simple information. */
function modal({ title, text, okLabel = 'OK', cancelLabel = null, danger = false }) {
  $('modalTitle').textContent = title;
  $('modalText').textContent = text;
  $('modalOk').textContent = okLabel;
  $('modalOk').className = danger ? 'danger' : '';
  $('modalCancel').hidden = !cancelLabel;
  $('modalCancel').textContent = cancelLabel || '';
  $('modal').hidden = false;
  return new Promise(resolve => {
    const close = result => { $('modal').hidden = true; resolve(result); };
    $('modalOk').onclick = () => close(true);
    $('modalCancel').onclick = () => close(false);
  });
}

// --- Onglets ---

function showTab(name) {
  if (!sending) { $('status').textContent = ''; $('progress').hidden = true; }
  tab = name;
  $('library').hidden = name !== 'library';
  $('add').hidden = name !== 'add';
  $('tabStories').classList.toggle('active', name === 'library' && category === 'stories');
  $('tabMusic').classList.toggle('active', name === 'library' && category === 'music');
  $('tabAdd').classList.toggle('active', name === 'add');
  renderAddTexts();
}

/** Change de rubrique ; la liste d'ajout en cours est gardée et ira dans la nouvelle rubrique. */
function setCategory(name) {
  if (category !== name) openStory = null;
  category = name;
}

$('tabStories').onclick = () => { setCategory('stories'); showTab('library'); refreshLibrary(); };
$('tabMusic').onclick = () => { setCategory('music'); showTab('library'); refreshLibrary(); };
$('tabAdd').onclick = () => { showTab('add'); refreshTarget(); };
$('switchCategory').onclick = async () => {
  if (sending) return;
  setCategory(category === 'music' ? 'stories' : 'music');
  showTab('add');
  await refreshTarget();
  // Les dossiers déjà présents dépendent de la rubrique.
  existing = (await api(withCategory('/folders')).then(r => r.text())).split('\n').filter(Boolean);
  renderStories();
};

function renderAddTexts() {
  $('tabAdd').textContent = `Ajouter à ${w().dir}`;
  $('addTitle').textContent = `Ajouter ${w().a}`;
  $('switchCategory').textContent = `Changer pour ${category === 'music' ? 'Histoires' : 'Musique'}`;
  $('dropHint').innerHTML = `Glisse ici un dossier d'${category === 'music' ? 'album' : 'histoire'}, plusieurs dossiers, ` +
    `ou tout le dossier <b>${w().dir}</b>.<br>Chaque dossier devient une tuile : fichiers audio + image <b>cover.jpg</b> (ou folder.jpg).`;
}
renderAddTexts();

// --- Bibliothèque (affichage seulement) ---

// Dernière liste connue de chaque rubrique : affichée tout de suite au changement d'onglet.
const libraryCache = {};
let libraryRequest = 0;
let freeBytes = null;

/**
 * Relit la rubrique affichée. Les réponses arrivant en retard (changement d'onglet entre-temps)
 * sont ignorées : sinon une longue liste d'histoires pouvait s'afficher dans l'onglet Musique.
 */
async function refreshLibrary() {
  const target = category;
  const request = ++libraryRequest;
  const cached = libraryCache[target];
  library = cached ? cached.library : null;
  existing = cached ? cached.existing : [];
  renderLibrary();
  renderStories();
  const [stories, folders, status] = await Promise.all([
    api(withCategory('/api/stories', target)).then(r => r.json()),
    api(withCategory('/folders', target)).then(r => r.text()),
    api(withCategory('/api/status', target)).then(r => r.json())
  ]);
  libraryCache[target] = { library: stories, existing: folders.split('\n').filter(Boolean) };
  freeBytes = status.free;
  if (request !== libraryRequest || category !== target) return;
  library = stories;
  existing = libraryCache[target].existing;
  $('libraryNotice').hidden = !status.access;
  $('libraryNotice').textContent = status.access ? `⚠ ${status.access}` : '';
  renderLibrary();
  renderStories();
}

refreshLibrary();

/**
 * Pochette d'une tuile. L'image est dans la page dès le départ (une image « lazy » hors de la page
 * ne se charge jamais) ; en cas d'erreur, la note de musique la remplace.
 */
function coverBox(story) {
  const cover = el('div', { className: 'cover', textContent: story.hasCover ? '' : w().icon });
  if (story.hasCover) {
    const img = el('img', { alt: '', loading: 'lazy', src: `/cover?id=${encodeURIComponent(story.id)}` });
    img.onerror = () => cover.replaceChildren(w().icon);
    cover.append(img);
  }
  return cover;
}

function renderLibrary() {
  if (!library) {
    $('libraryInfo').textContent = 'Chargement…';
    $('grid').replaceChildren();
    $('detail').replaceChildren();
    return;
  }
  const tracks = library.reduce((t, s) => t + s.tracks.length, 0);
  const bytes = library.reduce((t, s) => t + s.bytes, 0);
  $('libraryInfo').textContent = library.length
    ? `${plural(library.length, w().one)} · ${plural(tracks, 'piste')} · ${size(bytes)}`
    : w().none;
  if (freeBytes != null) $('libraryInfo').textContent += ` · ${size(freeBytes)} libre`;

  const tiles = library.map(story => {
    const cover = coverBox(story);
    const tile = el('div', { className: 'tile' + (openStory === story.id ? ' open' : ''), title: story.folder },
      cover,
      el('div', { className: 'title', textContent: story.title }),
      el('div', { className: 'meta', textContent: `${plural(story.tracks.length, 'piste')} · ${size(story.bytes)}` }));
    tile.onclick = () => { openStory = openStory === story.id ? null : story.id; renderLibrary(); };
    return tile;
  });

  const add = el('div', { className: 'tile add-tile' }, el('span', { textContent: '+' }), `Ajouter ${w().a}`);
  add.onclick = () => { showTab('add'); refreshTarget(); };
  $('grid').replaceChildren(...tiles, add);

  const story = library.find(s => s.id === openStory);
  // La fiche reste toujours affichée : invitation à choisir quand rien n'est sélectionné.
  if (!story) {
    $('detail').replaceChildren(el('div', { className: 'empty' },
      el('div', { className: 'cover', textContent: w().icon }),
      el('b', { textContent: `Sélectionner ${w().a}` }),
      el('div', { textContent: 'Choisis une tuile pour voir ses pistes, la télécharger ou la supprimer.' })));
  } else {
    const close = el('button', { className: 'close', textContent: '×', title: 'Fermer' });
    close.onclick = () => { openStory = null; renderLibrary(); };
    const cover = coverBox(story);
    $('detail').replaceChildren(
      close,
      cover,
      el('h2', { textContent: story.title }),
      el('div', { className: 'info', textContent: `Dossier : ${story.folder} · ${plural(story.tracks.length, 'piste')} · ${size(story.bytes)}` }),
      el('div', { className: 'row actions' },
        el('a', { className: 'button', textContent: '⬇ Télécharger', title: 'Télécharger sur l’ordinateur (.zip)', download: story.folder + '.zip',
                  href: `/download?id=${encodeURIComponent(story.id)}` }),
        deleteButton(story)),
      el('div', { id: 'detailError', className: 'banner err', hidden: true }),
      el('ol', {}, story.tracks.map(t => el('li', { textContent: t }))));
  }
}

function deleteButton(story) {
  const button = el('button', { className: 'danger', textContent: '🗑 Supprimer' });
  button.onclick = async () => {
    const ok = await modal({
      title: `Supprimer ${w().the} ?`,
      text: `« ${story.title} » (${plural(story.tracks.length, 'piste')}) sera effacé${category === 'music' ? '' : 'e'} de la boîte.`,
      okLabel: 'Supprimer', cancelLabel: 'Annuler', danger: true
    });
    if (!ok) return;
    button.disabled = true;
    const response = await api(`/api/story?id=${encodeURIComponent(story.id)}`, { method: 'DELETE' });
    if (!response.ok) {
      $('detailError').hidden = false;
      $('detailError').textContent = `⚠ ${await response.text()}`;
      button.disabled = false;
      return;
    }
    library = library.filter(s => s.id !== story.id);
    openStory = null;
    renderLibrary();
    setTimeout(refreshLibrary, 2500);
  };
  return button;
}

/**
 * La boîte relit ses dossiers ~1,5 s après le dernier fichier reçu, et la lecture peut être longue
 * sur une carte SD chargée : la bibliothèque est relue jusqu'à ce que les dossiers envoyés y figurent.
 */
async function waitForFolders(target, folders) {
  for (let attempt = 0; attempt < 15; attempt++) {
    await new Promise(resolve => setTimeout(resolve, 1500));
    if (category !== target) return;
    try { await refreshLibrary(); } catch (e) { return; }
    const present = new Set(library.map(s => s.folder));
    if (folders.every(f => present.has(f))) return;
  }
}

async function refreshTarget() {
  const status = await api(withCategory('/api/status')).then(r => r.json());
  $('target').className = 'banner ' + (status.target ? 'info' : 'err');
  $('target').textContent = status.target
    ? `Les ${w().one}s seront ${w().saved} dans ${status.target}`
    : `⚠ Envoi impossible pour l’instant : ${status.problem}`;
}

// --- Ajout : sélection des fichiers ---

$('pickDir').onclick = () => $('dirInput').click();
$('pickFiles').onclick = () => $('fileInput').click();
$('dirInput').onchange = e => { addEntries([...e.target.files].map(f => ({ path: f.webkitRelativePath || f.name, file: f }))); e.target.value = ''; };
$('fileInput').onchange = e => { addEntries([...e.target.files].map(f => ({ path: f.name, file: f }))); e.target.value = ''; };

const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async e => {
  e.preventDefault();
  drop.classList.remove('over');
  const roots = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const entries = [];
  for (const root of roots) await walk(root, '', entries);
  addEntries(entries);
};

async function walk(entry, prefix, out) {
  const path = prefix + entry.name;
  if (entry.isFile) {
    out.push({ path, file: await new Promise((ok, ko) => entry.file(ok, ko)) });
    return;
  }
  const reader = entry.createReader();
  let batch;
  do {
    batch = await new Promise((ok, ko) => reader.readEntries(ok, ko));
    for (const child of batch) await walk(child, path + '/', out);
  } while (batch.length);
}

/**
 * Regroupe les fichiers en histoires :
 * - un dossier qui contient directement de l'audio est une histoire ;
 * - sinon chacun de ses sous-dossiers est une histoire (cas du dossier Histoires entier) ;
 * - les fichiers des sous-dossiers plus profonds (CD1/, CD2/…) sont aplatis : CD1_piste.mp3.
 */
function addEntries(entries) {
  const files = entries
    .map(e => ({ ...e, segs: e.path.split('/').filter(Boolean) }))
    .filter(e => !e.segs.some(s => JUNK.test(s)));
  const groups = new Map();
  const put = (name, rel, file) => {
    if (!groups.has(name)) groups.set(name, []);
    groups.get(name).push({ name: rel.join('_'), file });
  };

  files.filter(f => f.segs.length === 1).forEach(f => put(category === 'music' ? 'Nouvel album' : 'Nouvelle histoire', f.segs, f.file));

  const roots = new Set(files.filter(f => f.segs.length > 1).map(f => f.segs[0]));
  for (const root of roots) {
    const inRoot = files.filter(f => f.segs.length > 1 && f.segs[0] === root);
    const rootIsStory = inRoot.some(f => f.segs.length === 2 && AUDIO.includes(ext(f.segs[1])));
    for (const f of inRoot) {
      if (rootIsStory || f.segs.length === 2) put(root, f.segs.slice(1), f.file);
      else put(f.segs[1], f.segs.slice(2), f.file);
    }
  }

  for (const [name, list] of groups) {
    const same = stories.find(s => s.name === name && !inFlight.includes(s));
    if (same) same.files.push(...list);
    else stories.push({ name, files: list, enabled: true, touched: false });
  }
  stories.sort((a, b) => a.name.localeCompare(b.name, 'fr', { numeric: true }));
  renderStories();
}

// --- Ajout : vérification ---

function analyze(story) {
  const checks = [];
  const audio = story.files.filter(f => AUDIO.includes(ext(f.name))).sort((a, b) => a.name.localeCompare(b.name, 'fr', { numeric: true }));
  const images = story.files.filter(f => IMAGES.includes(ext(f.name)));
  const nfo = story.files.filter(f => NFO.includes(ext(f.name)));
  const ignored = story.files.filter(f => ![...AUDIO, ...IMAGES, ...NFO].includes(ext(f.name)));
  const uploads = [...audio, ...nfo];
  let cover = null;

  if (audio.length) checks.push(['ok', plural(audio.length, 'fichier') + ' audio']);
  else checks.push(['err', `Aucun fichier audio : ${w().the} n’apparaîtrait pas sur la boîte.`]);

  const named = images.find(f => COVER_NAME.test(f.name));
  if (story.customCover) {
    cover = { name: 'cover.' + ext(story.customCover.name).replace('jpeg', 'jpg'), file: story.customCover };
    checks.push(['ok', `Image choisie : ${story.customCover.name}`]);
  } else if (named) {
    cover = named;
    checks.push(['ok', `Image : ${named.name}`]);
  } else if (images.length) {
    const pick = images.find(f => COVER_HINT.test(f.name)) || [...images].sort((a, b) => b.file.size - a.file.size)[0];
    cover = { name: 'cover.' + ext(pick.name).replace('jpeg', 'jpg'), file: pick.file };
    checks.push(['warn', `Pas de cover.jpg ni folder.jpg : « ${pick.name} » sera envoyée comme ${cover.name}.`]);
  } else if (story.coverUrl) {
    checks.push(['ok', 'Image depuis un lien : la boîte la téléchargera après l’envoi.']);
  } else {
    checks.push(['alert', 'Aucune image : la tuile affichera ♪. Charge une image ou colle un lien ci-dessous.']);
  }
  if (cover) {
    uploads.push(cover);
    if (cover.file.size > 3e6) checks.push(['warn', `Image lourde (${size(cover.file.size)}) : une image de ~500 px suffit.`]);
  }
  if (images.length > 1) checks.push(['info', `${images.length - 1} autre(s) image(s) non envoyée(s).`]);
  if (nfo.length) checks.push(['ok', `Métadonnées : ${nfo.map(f => f.name).join(', ')}`]);
  if (ignored.length) checks.push(['info', `${plural(ignored.length, 'fichier')} ignoré(s) (type non pris en charge) : ${ignored.slice(0, 5).map(f => f.name).join(', ')}${ignored.length > 5 ? '…' : ''}`]);
  if (existing.includes(story.name)) checks.push(['warn', 'Ce dossier existe déjà sur la boîte : les fichiers seront ajoutés, ceux de même nom remplacés.']);

  if (!story.touched) story.enabled = audio.length > 0;
  return { checks, audio, cover, uploads, bytes: uploads.reduce((t, f) => t + f.file.size, 0) };
}

function renderStories() {
  const cards = stories.map((story, index) => {
    const result = analyze(story);
    story.uploads = result.uploads;

    const checkbox = el('input', { type: 'checkbox', checked: story.enabled, title: `Envoyer ${w().the}` });
    checkbox.onchange = () => { story.enabled = checkbox.checked; story.touched = true; renderStories(); };
    const name = el('input', { type: 'text', value: story.name, title: 'Nom du dossier sur la boîte' });
    name.onchange = () => { story.name = name.value.trim() || story.name; renderStories(); };
    const remove = el('button', { className: 'secondary', textContent: '✕', title: 'Retirer' });
    remove.onclick = () => { stories.splice(index, 1); renderStories(); };

    const thumb = el('img', { alt: '', onerror: () => { thumb.hidden = true; } });
    if (result.cover) thumb.src = URL.createObjectURL(result.cover.file);
    else if (story.coverUrl) thumb.src = story.coverUrl;
    else thumb.hidden = true;

    return el('div', { className: 'card' + (story.enabled ? '' : ' off') },
      el('header', {}, checkbox, thumb, name, remove),
      el('div', { className: 'summary', textContent: `${result.uploads.length} fichier(s) à envoyer · ${size(result.bytes)}` }),
      el('ul', { className: 'checks' }, result.checks.map(([level, text]) =>
        el('li', { className: level === 'alert' ? 'err' : level, textContent: { ok: '✔ ', warn: '⚠ ', alert: '⚠ ', err: '✘ ', info: 'ℹ ' }[level] + text }))),
      coverPicker(story, result),
      el('details', {}, el('summary', { textContent: 'Pistes (ordre de lecture)' }),
        el('ol', {}, result.audio.map(f => el('li', { textContent: f.name }))))
    );
  });

  $('stories').replaceChildren(...cards);
  const selected = stories.filter(s => s.enabled);
  const bytes = selected.reduce((t, s) => t + s.uploads.reduce((u, f) => u + f.file.size, 0), 0);
  $('actions').hidden = stories.length === 0;
  $('send').disabled = sending || selected.length === 0;
  $('totals').textContent = `${plural(selected.length, w().one)} · ${size(bytes)}`;
}

/** Sans image dans le dossier : en charger une depuis l'ordinateur, ou donner un lien que la boîte téléchargera. */
function coverPicker(story, result) {
  if (story.coverUrl && !result.cover) {
    const remove = el('button', { className: 'secondary', textContent: 'Retirer le lien' });
    remove.onclick = () => { story.coverUrl = null; renderStories(); };
    return el('div', { className: 'row cover-pick' }, el('span', { className: 'info', textContent: story.coverUrl }), remove);
  }
  if (result.cover) return '';
  const input = el('input', { type: 'file', accept: '.jpg,.jpeg,.png,image/jpeg,image/png', hidden: true });
  input.onchange = () => { if (input.files[0]) { story.customCover = input.files[0]; renderStories(); } };
  const pick = el('button', { textContent: 'Charger une image…' });
  pick.onclick = () => input.click();
  const link = el('input', { type: 'text', placeholder: 'ou coller le lien d’une image (https://…)' });
  const use = el('button', { className: 'secondary', textContent: 'Utiliser le lien' });
  const apply = () => {
    const value = link.value.trim();
    if (!/^https?:\/\/\S+$/i.test(value)) { link.classList.add('bad'); return; }
    story.coverUrl = value;
    renderStories();
  };
  use.onclick = apply;
  link.onkeydown = e => { if (e.key === 'Enter') apply(); };
  return el('div', { className: 'row cover-pick' }, pick, input, link, use);
}

$('clear').onclick = () => { stories = []; $('status').textContent = ''; renderStories(); };

// --- Ajout : envoi ---

// Recharger ou fermer la page coupe l'envoi en cours : le navigateur demande confirmation.
window.addEventListener('beforeunload', e => {
  if (!sending) return;
  e.preventDefault();
  e.returnValue = '';
});

function upload(target, folder, item, onProgress) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', withCategory(`/upload?folder=${encodeURIComponent(folder)}&name=${encodeURIComponent(item.name)}`, target));
    xhr.upload.onprogress = e => onProgress(e.loaded);
    xhr.onload = () => resolve(xhr.status === 200 ? null : `${item.name} : ${xhr.responseText}`);
    xhr.onerror = () => resolve(`${item.name} : connexion perdue`);
    xhr.send(item.file);
  });
}

$('send').onclick = async () => {
  const selected = stories.filter(s => s.enabled);
  const bytes = selected.reduce((t, s) => t + s.uploads.reduce((u, f) => u + f.file.size, 0), 0);
  const confirmed = await modal({
    title: `Envoyer dans ${w().dir} ?`,
    text: `${plural(selected.length, w().one)} · ${size(bytes)}\n` + selected.map(s => '· ' + s.name).join('\n'),
    okLabel: 'Envoyer', cancelLabel: 'Annuler'
  });
  if (!confirmed) return;
  // La rubrique est figée pour tout l'envoi, même si l'on change d'onglet entre-temps.
  const target = category;
  sending = true;
  inFlight = selected;
  renderStories();
  $('status').textContent = 'Préparation…';
  $('bar').style.width = '0';
  $('progress').hidden = false;
  const errors = [];
  let sent = 0, skipped = 0;

  const plan = [];
  for (const story of selected) {
    const present = new Map((await (await api(withCategory(`/files?folder=${encodeURIComponent(story.name)}`, target))).text())
      .split('\n').filter(Boolean).map(line => line.split('\t')).map(([n, s]) => [n, Number(s)]));
    for (const item of story.uploads) {
      if (present.get(item.name) === item.file.size) skipped++;
      else plan.push({ folder: story.name, item });
    }
  }

  const total = plan.reduce((t, p) => t + p.item.file.size, 0) || 1;
  let done = 0;
  for (const [i, { folder, item }] of plan.entries()) {
    $('status').textContent = `Envoi ${i + 1}/${plan.length} : ${folder} / ${item.name}`;
    const error = await upload(target, folder, item, loaded => { $('bar').style.width = `${(done + loaded) / total * 100}%`; });
    done += item.file.size;
    $('bar').style.width = `${done / total * 100}%`;
    if (error) errors.push(error); else sent++;
  }

  // Pochettes données par un lien : téléchargées par la boîte, une fois le dossier créé.
  for (const story of selected) {
    if (!story.coverUrl || story.uploads.some(u => /^cover\./i.test(u.name))) continue;
    $('status').textContent = `Image de ${story.name} : téléchargement par la boîte…`;
    const response = await api(withCategory(`/api/cover-url?folder=${encodeURIComponent(story.name)}&url=${encodeURIComponent(story.coverUrl)}`, target), { method: 'POST' });
    if (!response.ok) errors.push(`${story.name} / image : ${await response.text()}`);
  }

  sending = false;
  inFlight = [];
  const summary = `${plural(sent, 'fichier')} envoyé${sent > 1 ? 's' : ''}` + (skipped ? `, ${skipped} déjà présent(s)` : '');

  if (errors.length) {
    // En cas d'erreur on reste sur l'onglet, avec le détail.
    $('status').textContent = [`${summary}, ${plural(errors.length, 'erreur')} :`, ...errors.map(e => '✘ ' + e)].join('\n');
    renderStories();
    refreshTarget();
    return;
  }

  // Seuls les éléments envoyés quittent la liste : ceux ajoutés pendant l'envoi restent, prêts à partir.
  stories = stories.filter(s => !selected.includes(s));
  renderStories();
  $('status').textContent = '';
  $('progress').hidden = true;
  const waiting = stories.length
    ? `\n${plural(stories.length, 'élément')} ajouté${stories.length > 1 ? 's' : ''} pendant l’envoi reste${stories.length > 1 ? 'nt' : ''} dans la liste.`
    : '';
  await modal({ title: 'Envoi terminé', text: `${summary}.\nLes ${words[target].one}s apparaissent dans l’onglet ${words[target].dir}.${waiting}` });
  const sentFolders = selected.map(s => s.name);
  if (!stories.length) {
    setCategory(target);
    showTab('library');
  }
  waitForFolders(target, sentFolders);
};
</script>
